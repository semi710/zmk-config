name: Build ZMK Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CACHIX_TOKEN: ${{ secrets.NIJA_CACHIX_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # one entry per keyboard from keyboards.nix
        keyboard: [corne]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            substituters = https://cache.nixos.org/ https://nija.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nija.cachix.org-1:wJRNRxBn1M1SAgzVv5ZAMe07ky6bkSSznMH0tEOFdcA=

      # pushes only when the NIJA_CACHIX_TOKEN secret is set
      - uses: cachix/cachix-action@v15
        if: env.CACHIX_TOKEN != ''
        with:
          name: nija
          authToken: ${{ secrets.NIJA_CACHIX_TOKEN }}

      - name: Build firmware
        run: nix build .#${{ matrix.keyboard }} --out-link firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.keyboard }}
          path: firmware/*.uf2
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: firmware-*
          delete-merged: true

  # every main push refreshes the rolling `latest` release so the firmware is
  # always downloadable; v* tag pushes cut a versioned release instead
  release:
    needs: [build, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Checksums
        run: cd firmware && sha256sum ./*.uf2 > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            gh release create "$GITHUB_REF_NAME" firmware/*.uf2 firmware/checksums.txt \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest firmware/*.uf2 firmware/checksums.txt \
              --title "latest" --prerelease --target "$GITHUB_SHA" \
              --notes "Rolling firmware from ${GITHUB_SHA::7}"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - run: nix flake check --no-build
