# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
# Set sleep timeout to 10min (10*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_IDLE_TIMEOUT= 30000



CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Pressed-key history: X small (avoid 68-width text overflow), Y=141 just below dots at Y=137 => bottom region
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=141

# Dot strip geometry: the 68x160 canvas rotates onto the 128x32 screen, so only
# canvas cx 0..31 is visible. 3 dots span 17px (7px pitch, 3px wide) -> X=7
# centers them: wy 7..23 vs screen center 15.5.
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=7
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=137

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_XTAL_ADVANCED=n
CONFIG_BT_CTLR_SCHED_ADVANCED=n